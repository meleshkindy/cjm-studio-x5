services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cjm_studio
      POSTGRES_USER: cjm_studio
      POSTGRES_PASSWORD: cjm_studio
    ports:
      - "5432:5432"
    volumes:
      - cjm_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cjm_studio -d cjm_studio"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  cjm_postgres_data:
